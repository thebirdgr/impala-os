# ~/.config/pipewire/pipewire-pulse.conf.d/90-impala-mpd.conf (desktop user)
# Lets the system MPD (user "mpd") play into the desktop session's PipeWire,
# and so to Bluetooth headphones/AirPods. Loopback only: not reachable from
# the network. Undo: delete the file, `systemctl --user restart pipewire-pulse`.
pulse.properties = {
    server.address = [ "unix:native" "tcp:127.0.0.1:4713" ]
}
