# MPD configuration for Impala OS (installed to /etc/impala-os/mpd.conf by
# scripts/pi-setup-mpd.sh; Debian's /etc/mpd.conf is left untouched).

music_directory     "/srv/music"
playlist_directory  "/var/lib/mpd/playlists"
db_file             "/var/lib/mpd/tag_cache"
state_file          "/var/lib/mpd/state"
sticker_file        "/var/lib/mpd/sticker.sql"
user                "mpd"

# Local only. The app talks to MPD over loopback; nothing is exposed on
# Wi-Fi or Ethernet.
bind_to_address     "localhost"
port                "6600"

auto_update         "yes"
restore_paused      "yes"
state_file_interval "30"
zeroconf_enabled    "no"
filesystem_charset  "UTF-8"

# Kept for M2 (HTTP streams from Navidrome); unused offline.
input {
    plugin "curl"
}

decoder {
    plugin  "hybrid_dsd"
    enabled "no"
}
decoder {
    plugin  "wildmidi"
    enabled "no"
}

# M1: Pi 4 3.5 mm jack. M2+: switch to the USB DAC feeding the Alpine unit
# (see docs/ARCHITECTURE.md). plughw converts formats if needed.
audio_output {
    type          "alsa"
    name          "Headphone jack"
    device        "plughw:CARD=Headphones,DEV=0"
    mixer_type    "hardware"
    mixer_device  "hw:CARD=Headphones"
    mixer_control "PCM"
}
